name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Instalar dependências (sem executar scripts de terceiros)
        run: npm ci --ignore-scripts

      - name: Verificar assinaturas/proveniência dos pacotes no registry do npm
        run: npm audit signatures

      - name: Verificar vulnerabilidades conhecidas (nível alto/crítico)
        run: npm audit --audit-level=high

      - name: Garantir que todo pacote do lockfile vem do registry oficial do npm
        run: |
          node -e "
            const lock = require('./package-lock.json');
            const bad = [];
            for (const [name, pkg] of Object.entries(lock.packages || {})) {
              if (!pkg.resolved) continue;
              if (!pkg.resolved.startsWith('https://registry.npmjs.org/')) {
                bad.push(name + ' -> ' + pkg.resolved);
              }
            }
            if (bad.length > 0) {
              console.error('Pacotes resolvidos fora do registry oficial do npm:');
              for (const b of bad) console.error('  ' + b);
              process.exit(1);
            }
            console.log('OK: todos os pacotes resolvem para registry.npmjs.org');
          "

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    needs: security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Instalar dependências (sem executar scripts de terceiros)
        run: npm ci --ignore-scripts

      - name: Compilar (tsc)
        run: npm run build

      - name: Rodar a suíte de testes (vitest)
        run: npm test
